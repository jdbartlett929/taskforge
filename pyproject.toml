[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge"
version = "0.1.0"
description = "A durable distributed job queue with priority scheduling and fenced worker leases."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4", "redis>=5.2,<7", "pydantic-settings>=2.7,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "httpx>=0.28,<1", "fakeredis[lua]>=2.28,<3", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["taskforge*"]
[tool.setuptools.package-data]
taskforge = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL and Redis"]
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
