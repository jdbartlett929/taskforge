name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: taskforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskforge -d taskforge_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://taskforge:test-only-password@localhost:5432/taskforge_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest -q --cov=taskforge --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Measure a small real-service benchmark
        run: python scripts/benchmark.py --jobs 100 --workers 8 --deadline 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-benchmark-results
          path: |
            test-results.xml
            coverage.xml
            benchmark-results/*.json
  docker:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-test-password
          TASKFORGE_API_KEY: ci-only-test-key-at-least-24-characters
        run: docker compose config --quiet
      - run: docker build -t taskforge:ci .
      - name: Smoke test Docker Compose services
        env:
          POSTGRES_PASSWORD: ci-only-test-password
          TASKFORGE_API_KEY: ci-only-test-key-at-least-24-characters
        run: |
          docker compose up -d --scale worker=2
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health/ready; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health/ready
          python scripts/smoke.py
      - name: Service logs
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only-test-password
          TASKFORGE_API_KEY: ci-only-test-key-at-least-24-characters
        run: docker compose logs --no-color --tail=80
      - name: Stop disposable CI services
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only-test-password
          TASKFORGE_API_KEY: ci-only-test-key-at-least-24-characters
        run: docker compose down -v
